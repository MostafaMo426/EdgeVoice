name: voice_assistant
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.7.0
  speech_to_text: ^7.0.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  supabase_flutter: ^2.8.1
  http: ^1.2.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  record: ^6.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  animations: ^2.0.11
  http_parser: ^4.1.2
  flutter_blue_plus: ^1.34.4
  app_settings: ^5.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
